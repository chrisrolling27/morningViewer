<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Viewer</title>
<link rel="artifact-thumbnail" href="thumb.jpg">
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg stroke='%23f2b33d' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M32 4v9M32 51v9M4 32h9M51 32h9M12.2 12.2l6.4 6.4M45.4 45.4l6.4 6.4M12.2 51.8l6.4-6.4M45.4 18.6l6.4-6.4'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='13' fill='%23ffc94d' stroke='%23e39a1f' stroke-width='2'/%3E%3C/svg%3E">
<!--
  Morning Viewer: a 3D, interactive map of the family farm in Morning View, Kentucky, built only from free public data.
  Everything it shows is bundled in data/area-3/ (made by scripts/fetch_data.py, then scripts/build_data.py),
  so the page never depends on the source servers. The only outside request is three.js from jsDelivr.

  Four views
  - Today:   the newest aerial photo (county, 2026) on the bare-earth lidar, plus 3D trees and buildings.
  - Topo:    colour by height, hill shading and 10 ft contour lines, drawn in the browser from the bare-earth lidar.
  - Slope:   colour by steepness (flat to over 30 degrees), same source.
  - History: one timeline of every photo year from 1962 to 2026, without today's trees and buildings
             (they would not match old photos). Trees are a layer you can switch off in the other views.

  Data
  - Elevation: KyFromAbove 2 ft lidar. Bare earth = ground with trees and buildings removed; first return = the
    first thing the laser hit (treetops, roofs). Tree height = first return minus ground. The 3-mile square uses a
    1024 x 1024 grid (~4.7 m apart); the 1-mile square around the house is a second grid (~1.2 m apart) laid into
    the middle, with close-up photos (~0.4 m per pixel; the 3-inch 2022-24 flight at ~0.2 m on desktops).
  - Photos: county (LINK-GIS) 1962, 1973, 1989, 2023, 2025, 2026; USGS 1990s; USDA NAIP summers 2004-2022;
    Northern Kentucky 2007; USGS 2009; KyFromAbove 2012, 2019-22, 2022-24.
  - Layers: county parcels (shapes only), buildings and roads (LINK-GIS); creeks and ponds (USGS NHD);
    flood zones (FEMA NFHL); wetlands (US Fish & Wildlife NWI); soils (USDA SSURGO);
    driveways (OpenStreetMap).
  - Trees: one small 3D tree per treetop found in the lidar (the highest point within ~6 m around the farm,
    ~14 m elsewhere; none on building roofs), sized by its measured height.

  How the 3D works (three.js)
  - All layers are in Web Mercator (EPSG:3857), so they line up exactly. World units are ground metres,
    x = east, z = south, y = up, with the house at (0, 0). The ground is drawn at 2x its real relief so the
    hills read from above. Tree heights from the lidar are used for building heights and the tap readout only.
  - The 3-mile surface cuts a hole where the farm close-up sits (a tiny shader "discard").
  - The map is wrapped over the surface as a texture; the layers are drawn onto a second, transparent texture.

  Open locally: `python3 -m http.server 8000` in this folder, then http://localhost:8000
  (double-clicking the file won't work: browsers block reading data/ from a file:// page).
-->
<style>
:root{--ink:#f3efe4;--mute:#a8a493;--panel:rgba(17,22,19,.88);--line:rgba(255,255,255,.13);--acc:#e9b44c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e1311;color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#panel{position:fixed;left:10px;top:10px;width:290px;max-height:calc(100% - 20px);overflow:auto;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px 13px;z-index:5}
#panel.min .body{display:none}
h1{font-size:16px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1 button{background:none;border:0;color:var(--acc);font-size:20px;cursor:pointer;padding:0 6px;min-width:32px;min-height:32px}
.sub{color:var(--mute);font-size:12px;margin:2px 0 4px}
.grp{margin-top:12px}
.lab{font-size:12px;color:var(--mute);margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.seg{display:flex;gap:4px}
.seg button,.pbtn{flex:1 1 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 4px;font:inherit;font-size:13px;cursor:pointer;min-height:38px}
.seg button.on{background:var(--acc);color:#1d1606;border-color:var(--acc);font-weight:600}
.seg button:hover:not(.on){border-color:var(--mute)}
button:focus,button:focus-visible{outline:none;box-shadow:none}
.pbtn{flex:0 0 44px;font-size:15px}.pbtn.on{background:var(--acc);color:#1d1606}
input[type=range]{width:100%;accent-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center}
#timeline{display:none}
#yearNote{font-size:11px;color:var(--mute);margin-top:4px;min-height:15px}
.ticks{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
label.tick{font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;min-height:26px}
label.tick i{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
label.tick.soon{opacity:.5;cursor:default}
label.tick small{font-size:10px;text-transform:uppercase;letter-spacing:.04em;border:1px solid currentColor;border-radius:3px;padding:0 3px;margin-left:2px}
#status{position:fixed;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--mute);z-index:5}
#yearBig{position:fixed;right:16px;top:8px;font-size:42px;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 14px #000;pointer-events:none;z-index:4}
#legend{display:none;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:11px;margin-top:10px}
#legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#readout{font-size:12px;margin-top:10px;min-height:16px;color:var(--acc);line-height:1.5}
#readout b{color:var(--ink);font-weight:600}
.hint{font-size:11px;color:var(--mute);margin-top:8px}
#compass{position:fixed;right:14px;bottom:44px;width:48px;height:48px;border-radius:50%;background:var(--panel);border:1px solid var(--line);padding:3px;cursor:pointer;z-index:5}
#needle{display:block}
#wps{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.wp{position:absolute;width:0;height:0;display:none}
.wp i{position:absolute;left:-9px;top:-26px;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ff6b35;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:auto;cursor:pointer}
.wp span{position:absolute;left:12px;top:-30px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:600;color:#fff;background:rgba(17,22,19,.82);border:1px solid rgba(255,107,53,.75);padding:1px 6px;border-radius:5px;pointer-events:auto;cursor:pointer}
.wp.area span{left:0;top:0;transform:translate(-50%,-50%);border-style:dashed}
.wp.dot i{left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;transform:none;cursor:default}
.wp.dot.first i{left:-9px;top:-9px;width:18px;height:18px;background:#fff;border-color:#ff6b35}
.wp.sel i{background:var(--acc)}.wp.sel span{border-color:var(--acc);border-style:solid}
body.wpAdd .wp i,body.wpAdd .wp span{pointer-events:none}
#wpList{display:none;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:11px;color:var(--mute)}
#wpList button{background:transparent;color:var(--ink);border:1px solid rgba(255,107,53,.6);border-radius:12px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer;min-height:28px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wpList button.area{border-style:dashed}
#readout .wpAct,#readout .wpForm{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
#readout button.rb{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;min-height:32px}
#readout button.rb.pri{background:#ff6b35;border-color:#ff6b35;color:#fff;font-weight:600}
#readout input.wpIn{flex:1 1 140px;min-width:0;background:rgba(0,0,0,.35);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;font-size:16px}
#tap{position:fixed;z-index:3;pointer-events:none;width:0;height:0;display:none}
#tap i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
#tap b{position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:50%;border:2px solid var(--acc);animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(.4);opacity:.9}to{transform:scale(1.5);opacity:0}}
@media(prefers-reduced-motion:reduce){#tap b{animation:none;opacity:.6}}
.turn{position:fixed;bottom:50px;width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;z-index:5;touch-action:none;user-select:none}
#turnL{right:116px}#turnR{right:72px}
@media(max-width:600px){#panel{width:calc(100% - 20px);max-height:50%}#yearBig{font-size:30px;top:auto;bottom:96px;right:16px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>Morning Viewer <button id="min" title="Hide controls">–</button></h1>
  <div class="body">
    <div class="grp"><div class="lab">Map</div><div class="seg" id="view"><button data-v="today">Today</button><button data-v="topo">Topo</button><button data-v="slope">Slope</button><button data-v="history">History</button></div></div>
    <div class="grp" id="timeline">
      <div class="lab"><span>Back in time</span><span id="yearLab"></span></div>
      <div class="row"><button id="play" class="pbtn" title="Play from oldest to newest">▶</button><input type="range" id="year" min="0" max="0" step="1" value="0" aria-label="Photo year"></div>
      <div id="yearNote"></div>
    </div>
    <div id="legend"></div>
    <div class="grp"><div class="lab">Camera</div><div class="seg" id="goto"><button data-v="farm">The farm</button><button data-v="all" title="See the whole 3-mile square">Whole map</button><button data-v="spin" title="Slowly circle around (tap again to stop)">Spin 360°</button></div></div>
    <div class="grp"><div class="lab">Layers</div><div class="ticks" id="layers"></div></div>
    <div class="grp"><div class="lab"><span>Waypoints</span><span id="wpCount"></span></div>
      <div class="seg" id="wpMode"><button data-v="point" title="Tap the map to drop a named point">Add point</button><button data-v="area" title="Tap the map to place the corners of an area">Add area</button></div>
      <div id="wpList"></div></div>
    <div id="readout"></div>
    <div class="hint">W A S D move · Q E turn · ↑ ↓ tilt · Shift = faster</div>
  </div>
</div>
<div id="yearBig"></div>
<div id="wps"></div>
<div id="tap"><b></b><i></i></div>
<button id="compass" title="Madison Pike is up · tap for north up" aria-label="Compass: switch between Madison Pike up and north up"><svg id="needle" viewBox="0 0 40 40" width="40" height="40"><path d="M20 4 L26 21 L20 18 L14 21 Z" fill="#d8342b"/><path d="M20 36 L14 19 L20 22 L26 19 Z" fill="#f3efe4"/><text x="20" y="13.5" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">N</text></svg></button>
<button class="turn" id="turnL" title="Turn left (or ← key; hold to keep turning)" aria-label="Turn view left">⟲</button>
<button class="turn" id="turnR" title="Turn right (or → key; hold to keep turning)" aria-label="Turn view right">⟳</button>
<div id="status">Starting…</div>

<script>if(matchMedia('(max-width:600px)').matches){document.getElementById('panel').classList.add('min');document.getElementById('min').textContent='+';}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/+esm';
import {MapControls} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/MapControls.js/+esm';

const $=id=>document.getElementById(id), status=m=>{$('status').textContent=m;};
const LOCAL='data/area-3/';

// ---- Where and how big (scripts/fetch_data.py reads FARM and the layer lists below) ------------------
const FARM={lat:38.878617,lon:-84.535389};             // Census geocode of the address
const AREA=3;                                          // miles per side
// Web Mercator: x = R·lon, y = R·ln(tan(45° + lat/2)). Mercator stretches distances by 1/cos(lat),
// so a square of S ground metres is S/cos(lat) Mercator metres wide. Ground metres = Mercator metres × cosL.
const R=6378137,cosL=Math.cos(FARM.lat*Math.PI/180),CX=R*FARM.lon*Math.PI/180,CY=R*Math.log(Math.tan(Math.PI/4+FARM.lat*Math.PI/360));
const S=AREA*1609.34,HM=S/2/cosL;
const FT=0.3048, EX=2, SUN=225; // ground drawn at 2x relief; afternoon sun from the SW
const ROAD=3.7; // compass bearing of Madison Pike past the house (from the county road centerline): the map opens with it running up the screen

// Photo layers the download script fetches (it reads these three lines; keep their shape)
const mk=(list,size,nearest)=>({list:list.map(([s,y])=>({svc:'ImageServices/'+s,year:y})),size,nearest});
const SERIES={
  summer:mk([['Ky_NAIP_2004_1M','2004'],['Ky_NAIP_2006_2FT','2006'],['Ky_NAIP_2008_1M','2008'],['Ky_NAIP_2010_1M','2010'],['Ky_NAIP_2012_1M','2012'],['Ky_NAIP_2014_1M','2014'],['Ky_NAIP_2016_2FT','2016'],['Ky_NAIP_2018_2FT','2018'],['Ky_NAIP_2020_2FT','2020'],['Ky_NAIP_2022_2FT','2022']],2048),
  hires:mk([['Ky_DOQ_BW_PHASE1_1M','1990s'],['Ky_NKAPC_2007_6IN','2007'],['Ky_NKY_USGS_2009_1FT','2009'],['Ky_KYAPED_NKY_2012_6IN','2012'],['Ky_KYAPED_Phase2_6IN','2019–22'],['Ky_KYAPED_Phase3_3IN','2022–24']],4096),
  nlcd:mk([['KY_NLCD_1992_30M','1992'],['Ky_NLCD_2001_30M','2001'],['Ky_NLCD_2006_30M','2006'],['Ky_NLCD_2011_30M','2011'],['Ky_NLCD_2016_30M','2016'],['Ky_NLCD_2019_30M','2019'],['Ky_NLCD_2021_30M','2021']],512,true)};
// Northern Kentucky county aerials (LINK-GIS)
const COUNTY=[['Archive_Aerials/ArchiveAerial_1962','1962'],['Archive_Aerials/ArchiveAerial_1973','1973'],['Archive_Aerials/ArchiveAerial_1989','1989'],
  ['Basemaps/AerialBase_2023','2023'],['Basemaps/AerialBase_2025_HighScale_CC_KC_PC','2025'],['Basemaps/AerialBase_2026_HighScale_CC_KC','2026']];
const TODAY='linkgis:Basemaps/AerialBase_2026_HighScale_CC_KC'; // the main view's photo: the newest
// One timeline, one photo per year: where two flights share a year, the sharper one wins (listed first)
const NOTE={'linkgis:Archive_Aerials/ArchiveAerial_1962':'County archive · black & white','linkgis:Archive_Aerials/ArchiveAerial_1973':'County archive · black & white',
  'linkgis:Archive_Aerials/ArchiveAerial_1989':'County archive · black & white','ImageServices/Ky_DOQ_BW_PHASE1_1M':'USGS · black & white',
  'ImageServices/Ky_NKAPC_2007_6IN':'Northern Kentucky planning · 6-inch','ImageServices/Ky_NKY_USGS_2009_1FT':'USGS · 1 ft',
  'ImageServices/Ky_KYAPED_NKY_2012_6IN':'KyFromAbove · 6-inch','ImageServices/Ky_KYAPED_Phase2_6IN':'KyFromAbove · 6-inch',
  'ImageServices/Ky_KYAPED_Phase3_3IN':'KyFromAbove · 3-inch · leaf-off','linkgis:Basemaps/AerialBase_2023':'County aerial',
  'linkgis:Basemaps/AerialBase_2025_HighScale_CC_KC_PC':'County aerial','linkgis:Basemaps/AerialBase_2026_HighScale_CC_KC':'County aerial · newest'};
const yk=y=>({'1990s':1995,'2019–22':2020.5,'2022–24':2022.5})[y]||parseFloat(y);
let HIST=[]; // filled from the manifest: [{svc, year, note}], oldest first
const SLOPE_KEY=[['#bedc8c','Flat, under 5°'],['#f0d65a','Gentle, 5–10°'],['#f0a53c','Moderate, 10–15°'],['#e06a2c','Steep, 15–20°'],['#b3262a','Very steep, 20–30°'],['#5a1236','Over 30°']];
const LAYERS=[['trees','Trees','#3e6b2c',true],['roads','Roads','#ffffff',true],['water','Creeks & ponds','#3f93dc',true],['parcels','Property lines','#ffd84a',false],
  ['soils','Soils','#c9a15a',false],['waypoint','Waypoints','#ff6b35',true]]; // [key, name, swatch, on at start, optional 'soon' = greyed-out placeholder]

const st={view:'today',h:0,play:false,lay:Object.fromEntries(LAYERS.map(l=>[l[0],l[3]]))};

// ---- Loading bundled files (fetch + blob URLs, so it also works where only same-origin requests are allowed) ----
let M=null;
async function getFile(f,how){const r=await fetch(LOCAL+f);if(!r.ok)throw new Error(f+' '+r.status);return how==='json'?r.json():how==='blob'?r.blob():r;}
async function img(f){const im=new Image();im.src=URL.createObjectURL(await getFile(f,'blob'));await im.decode();return im;}
async function gunzip(f){ // grids are gzip, stored as base64 text so any static host will serve them
  const b=Uint8Array.from(atob((await (await getFile(f)).text()).trim()),c=>c.charCodeAt(0));
  return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();}
async function grid(d,c){ // dem: 16-bit steps above a base height, each stored as the change from the previous value; canopy: 8-bit tree/roof heights
  const n=d.n*d.n,q=new Uint16Array(await gunzip(d.file)),k=new Uint8Array(await gunzip(c.file));
  if(q.length!==n||k.length!==n)throw new Error('elevation file is the wrong size');
  const dem=new Float32Array(n),can=new Float32Array(n);
  for(let i=0,a=0;i<n;i++){a=(a+q[i])&65535;dem[i]=d.base+a*d.step;can[i]=k[i]*c.step;}return {n:d.n,dem,can};}
function halve(g){const n=Math.ceil(g.n/2),dem=new Float32Array(n*n),can=new Float32Array(n*n);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const s=Math.min(g.n-1,r*2)*g.n+Math.min(g.n-1,c*2);dem[r*n+c]=g.dem[s];can[r*n+c]=g.can[s];}return {n,dem,can};}

// ---- Renderer, scene, light ---------------------------------------------------------
const ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight,false);
ren.toneMapping=THREE.ACESFilmicToneMapping;ren.outputColorSpace=THREE.SRGBColorSpace;
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;ren.shadowMap.autoUpdate=false; // shadows redrawn only when the surface changes
const ANI=ren.capabilities.getMaxAnisotropy();
const scene=new THREE.Scene(),BG=new THREE.Color('#0e1311');scene.background=BG;scene.fog=new THREE.Fog(BG,S*2.2,S*6);
scene.add(new THREE.HemisphereLight('#d2e2ff','#5a4632',0.85));
const sun=new THREE.DirectionalLight('#fff0d4',2.6);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-S*.75,right:S*.75,top:S*.75,bottom:-S*.75,near:10,far:S*4});sun.shadow.normalBias=2;scene.add(sun,sun.target);
{const a=SUN*Math.PI/180,e=32*Math.PI/180,D=S*1.5;sun.position.set(Math.sin(a)*Math.cos(e)*D,Math.sin(e)*D,-Math.cos(a)*Math.cos(e)*D);}

// ---- Terrain: a 3-mile grid with a hole in the middle, and a fine 1-mile grid filling it -------------
const hole={value:new THREE.Vector4(0,0,0,0)}; // x0, z0, x1, z1 of the farm close-up, in world metres
function cutHole(m){m.onBeforeCompile=sh=>{sh.uniforms.hole=hole;
  sh.vertexShader='varying vec3 vW;\n'+sh.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\nvW=(modelMatrix*vec4(transformed,1.)).xyz;');
  sh.fragmentShader='uniform vec4 hole;varying vec3 vW;\n'+sh.fragmentShader.replace('void main() {','void main() {\nif(vW.x>hole.x&&vW.x<hole.z&&vW.z>hole.y&&vW.z<hole.w)discard;');};return m;}
const overMat=()=>new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});
function makeGrid(n,size,cx,cz){ // PlaneGeometry n×n, centred at (cx,cz); UVs in 3-mile-texture space
  const g=new THREE.PlaneGeometry(size,size,n-1,n-1);g.rotateX(-Math.PI/2);g.translate(cx,0,cz);
  const p=g.attributes.position.array,uv=g.attributes.uv.array;
  for(let i=0;i<n*n;i++){uv[i*2]=(p[i*3]+S/2)/S;uv[i*2+1]=1-(p[i*3+2]+S/2)/S;}return g;}
function makeSkirt(geo,n,drop,color){ // brown walls hanging from the grid's edge
  const e=[];for(let c=0;c<n;c++)e.push(c);for(let r=1;r<n;r++)e.push(r*n+n-1);for(let c=n-2;c>=0;c--)e.push((n-1)*n+c);for(let r=n-2;r>=0;r--)e.push(r*n);
  const sp=new Float32Array(e.length*6),sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  const si=[];for(let k=0;k<e.length-1;k++){const a=2*k;si.push(a,a+1,a+2,a+2,a+1,a+3);}sg.setIndex(si);
  const mesh=new THREE.Mesh(sg,new THREE.MeshStandardMaterial({color,roughness:1,side:THREE.DoubleSide}));
  const P=geo.attributes.position.array;
  mesh.update=()=>{e.forEach((v,j)=>{sp[j*6]=sp[j*6+3]=P[v*3];sp[j*6+1]=P[v*3+1];sp[j*6+4]=drop(P[v*3+1]);sp[j*6+2]=sp[j*6+5]=P[v*3+2];});sg.attributes.position.needsUpdate=true;sg.computeVertexNormals();};
  return mesh;}

const T={}; // T.base, T.inset: {n, dem, can, geo, mat, land, over, skirt}
let zmin=0,zmax=0;const pinPos=new THREE.Vector3();
function buildTerrain(){

  let [b,i]=await Promise.all([grid(M.dem,M.canopy),grid(M.inset.dem,M.inset.canopy)]);
  if(matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<900)i=halve(i); // phones: every other point (~2.4 m) to save memory
  T.base=b;T.inset=i;
  zmin=Infinity;zmax=-Infinity;for(const v of b.dem){if(v<zmin)zmin=v;if(v>zmax)zmax=v;}
  buildTerrain();heights();startView();
  await applyView();
  OV=await getFile(M.overlays,'json');updateLayers();buildHouses();await buildTrees();
}catch(e){status('Problem loading data: '+e.message);console.error(e);}
